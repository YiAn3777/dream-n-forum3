body{margin:0;background:#e1f0fc;color:var(--tx);min-height:100vh;
  font:16px/1.65 var(--rfont)}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--bgg)}
.w{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:0 16px 32px}
.mu{color:var(--mu)}

/* ============ 3. 頁首：標籤、標誌、標題 ============ */
header{text-align:center;padding:20px 0 24px;color:var(--hd)}
.hd{display:inline-block;max-width:100%}
.row{display:flex;justify-content:center;align-items:center;margin-bottom:16px}
.eb{display:table;margin:0 auto;padding:7px 40px 10px;line-height:1.3;white-space:nowrap;
  background:var(--tag);color:var(--tagtx);font-style:normal;font-weight:800;
  clip-path:polygon(0 0,100% 0,94% 100%,6% 100%)}
.mid{display:flex;justify-content:center;align-items:center;gap:28px}
.lg{display:block;flex:none;background-color:var(--lgc);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain}
.lg-l{-webkit-mask-image:var(--logo-l);mask-image:var(--logo-l);width:96px;aspect-ratio:380/302}
.lg-r{-webkit-mask-image:var(--logo-r);mask-image:var(--logo-r);width:150px;aspect-ratio:520/261}
.m{display:none}
h1{margin:0;font-family:var(--tfont);font-weight:700;font-size:clamp(30px,4vw,40px);line-height:1.25}
h1 .l1{display:block;white-space:nowrap}
h1 .l2{display:block;font-size:1.5em;color:var(--l2);text-align:justify;text-align-last:justify}
.lead{margin:16px auto 0;color:var(--hd)}

/* ============ 4. 區塊標題（斜切標籤）============ */
section,details.acc{margin-top:28px}
.st{display:inline-block;margin:0 0 12px;padding:5px 34px 5px 18px;font-size:21px;font-weight:800;
  line-height:1.65;font-style:normal;background:var(--tag);color:var(--tagtx);
  clip-path:polygon(0 0,100% 0,94% 100%,0 100%)}
summary.st{list-style:none;cursor:pointer}
summary.st::-webkit-details-marker{display:none}
details.mo-only{display:none}
summary.st::after{content:"▼";margin-left:.6em;font-size:.65em;vertical-align:.12em}
details[open]>summary.st::after{content:"▲"}
summary.st:hover{filter:brightness(1.06)}
summary.st:focus-visible{outline:3px solid var(--cy)}
details.acc:not([open])>summary.st{margin-bottom:0}

/* ============ 5. 面板、表單 ============ */
.panel{background:var(--card);border:1px solid var(--bd);border-top:4px solid var(--cy);
  border-radius:14px;padding:20px;box-shadow:0 6px 18px rgba(8,50,70,.14)}
.step{margin:0 0 8px;font-weight:700}
.step i{font-style:normal;color:var(--pr)}
.radios{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.radios label{flex:1 1 160px;cursor:pointer}
.radios input{position:absolute;opacity:0}
.radios span{display:block;padding:11px;text-align:center;font-weight:600;border:2px solid var(--bd);border-radius:6px}
.radios input:checked+span{background:var(--cy);border-color:var(--cy);color:#032a36}
.radios input:focus-visible+span{outline:3px solid var(--pr)}
select{width:100%;padding:12px;font:inherit;color:var(--tx);background:var(--card);
  border:2px solid #2fb8c8;border-radius:8px}
select:disabled{opacity:.55;cursor:not-allowed}
.go{display:inline-block;padding:11px 20px;border-radius:10px;background:var(--cy);color:#032a36;
  font-weight:700;text-decoration:none}
.go[aria-disabled=true]{opacity:.55;cursor:not-allowed;pointer-events:none}
.fb{display:flex;flex-direction:column;gap:10px}
.fb a{align-self:flex-start;padding-left:2em;color:var(--pr);font-size:18px;font-weight:700;
  text-decoration:underline;text-underline-offset:4px}
.fb a:hover{filter:brightness(1.2)}

/* ============ 6. 查詢結果 ============ */
#res{margin-top:20px}
.route{margin-bottom:12px;padding:12px 16px;color:#fff;font-size:19px;
  background:linear-gradient(120deg,#08264f,#0a4f8f 70%,#1a8fd0);border-left:6px solid var(--cy);border-radius:12px}
.route>div:first-child{color:var(--cy);font-size:27px;font-weight:800}
.rl span{display:block;font-size:15px;color:#cfe9ee}
.host{margin-bottom:12px;padding:12px 16px;text-align:left;background:var(--pl);border:1px solid rgba(10,79,196,.18);border-radius:12px}
.host span{display:block;font-size:14px;font-weight:700;color:var(--pr)}
.host b{display:inline;font-size:30px;line-height:1.3;color:var(--tx)}
.host b .ts{font-size:16px;font-weight:600;margin-left:3px}
.host small{display:inline;font-size:15px;color:var(--mu,#5a6b7d)}
.route small{display:block;color:#cfe9ee;font-size:13px}
.r{margin-bottom:10px;padding:14px 16px;background:var(--card);border:1px solid var(--bd);
  border-left:4px solid #2a8fd0;border-radius:12px}
.r .h{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:6px;font-weight:700}
.rm{padding:2px 20px 2px 12px;font-size:14px;background:var(--tag);color:var(--tagtx);
  clip-path:polygon(0 0,100% 0,90% 100%,0 100%)}
.tm{font-size:13px;font-weight:400;color:var(--lg)}
.it{padding:6px 0}.it+.it{border-top:1px dashed var(--bd)}
.it .t{font-size:14px;color:var(--mu)}
.cl{font-weight:600;color:var(--pr)}
.tp{color:var(--bl);font-weight:600}
.r.off{background:var(--wa);border-color:#e9b44c}
.r.off .tag{color:var(--wt);font-weight:700}
button.ac{margin-top:8px;padding:7px 14px;font:inherit;font-weight:600;color:var(--wt);
  background:transparent;border:1.5px solid currentColor;border-radius:10px;cursor:pointer}
.pn{display:none;margin-top:10px}.pn.o{display:block}
details.rd{margin:8px 0;padding:8px 12px;background:var(--card);border:1px solid var(--bd);border-radius:10px;color:var(--tx)}
details.rd>summary{cursor:pointer}
details.rd>summary .mu{display:block}

/* 講師／講題區塊 */
.blk{display:flex;flex-direction:column;gap:6px;margin-top:8px;padding:10px 12px;line-height:1.5;
  background:var(--pl);border:1px solid var(--bd);border-radius:10px}
.blk .cl{font-weight:700}
.blk.off2{margin:0;align-items:center;text-align:center;color:var(--wt);font-weight:700;
  background:var(--wa);border-color:#e9b44c}
/* 可展開的班級區塊（表三、表四） */
.dt{padding:10px 12px;line-height:1.5;text-align:center;background:var(--pl);
  border:1px solid #9ad3d8;border-left:4px solid #2a8fd0;border-radius:10px}
.dt+.dt{margin-top:10px}
.dt.rest{background:var(--wa);border-color:#e9b44c;border-left-color:#e9b44c}
.dt.rest .cl,.dt.rest .oo{color:var(--wt)}
.dt.rest .oo{font-size:14px;font-weight:600}
.dt summary{display:flex;justify-content:center;align-items:center;gap:8px;cursor:pointer;list-style:none}
.dt summary::-webkit-details-marker{display:none}
.ch{flex:none;width:9px;height:9px;margin:-3px 4px 0 0;border-right:2px solid var(--pr);
  border-bottom:2px solid var(--pr);transform:rotate(45deg);transition:transform .15s}
.dt[open] .ch{margin-top:3px;transform:rotate(-135deg)}
.bd2{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:10px;padding-top:10px;
  border-top:1px dashed var(--bd)}

/* ============ 7. 表格 ============ */
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px;
  box-shadow:0 4px 14px rgba(8,50,70,.1)}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{padding:10px 12px;text-align:center;vertical-align:middle;border-bottom:1px solid var(--bd)}
tr:last-child td{border-bottom:0}
th{background:var(--band);color:#fff}
th .sn{font-size:20px;color:var(--cy)}
th .tm{color:#9ed8e0}
.lb{display:none;text-align:center}.lb:empty{display:none!important}
/* 共學者跑班路線：三欄三色 */
#t2 th{font-size:18px}
#t2 td{padding:14px 12px;font-size:19px;font-weight:700}
#t2 td:nth-child(1){color:var(--c1);font-size:21px}
#t2 td:nth-child(2){color:var(--tx);font-weight:600}
#t2 td:nth-child(3){color:var(--bl)}
/* 發表者時間分配表：依教室分組 */
.gr{display:grid;grid-template-columns:minmax(100px,.7fr) repeat(3,1fr);gap:10px;align-items:center;
  padding:10px 0;border-top:1px dashed var(--bd);text-align:center}
.gh{margin-bottom:12px;padding:10px 12px;font-weight:700;background:var(--band);color:#fff;border:0;border-radius:12px}
.gh .sn{font-size:20px;color:var(--cy)}.gh .tm{color:#9ed8e0}
.rg{margin-bottom:16px;padding:6px 14px 8px;background:var(--pl);border:2px solid #2a8fd0;border-radius:14px}
.rt{display:inline-block;margin:6px 0 2px;padding:2px 28px 2px 16px;font-style:normal;
  background:var(--tag);color:var(--tagtx);clip-path:polygon(0 0,100% 0,92% 100%,0 100%)}
.rt+.gr{border-top:0}
#t4 .dt{background:var(--card)}

/* ============ 8. 關於我們 ============ */
.ft{position:relative;z-index:1;margin-top:8px;padding:28px 16px calc(28px + env(safe-area-inset-bottom,0px));
  background:var(--ftb);border-top:1px solid rgba(30,100,190,.18)}
.icons{display:flex;justify-content:center;flex-wrap:wrap;gap:22px}
.ic{display:block;width:56px;height:56px;border-radius:12px;overflow:hidden;
  box-shadow:0 3px 10px rgba(0,30,60,.35);transition:transform .15s}
.ic:hover{transform:translateY(-3px)}
.ic img{display:block;width:100%;height:100%}
.ci{margin-top:16px;text-align:center;font-size:13px;line-height:1.9;color:var(--hd)}
.ci a{color:inherit;text-decoration:none}

/* ============ 9. 響應式（手機）============ */
@media (max-width:700px){
  .hd{display:block;width:100%}
  h1{width:12em;max-width:100%;margin:0 auto;font-size:calc((100vw - 32px) / 12.1)}
  .m{display:block}.d{display:none}
  .row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;width:100%;gap:2vw}
  .row .lg-l{justify-self:start}.row .lg-r{justify-self:end}
  .eb{margin:0;padding:2vw 2.6vw 2.6vw;font-size:3.4vw}
  .lg-l.m{width:10.5vw}.lg-r.m{width:15.5vw}
  .lead{margin:16px 0 0;font-size:15px;text-align:center}
  .tw{background:transparent;border:0;box-shadow:none;overflow:visible}
  #t1{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
  #t1 th,#t1 td{padding:10px 8px}#t1 td:first-child{white-space:nowrap}#t1 .lb{display:none}
  /* 表二、表三改為卡片式 */
  #t2,#t2 tbody,#t2 tr,#t2 td,#t3,#t3 tbody,#t3 tr,#t3 td{display:block;width:100%}
  #t2 tr:first-child,#t3 tr:first-child{display:none}
  #t2 tr,#t3 tr{margin-bottom:10px;padding:6px 0;background:var(--card);border:1px solid var(--bd);border-radius:12px}
  #t2 td,#t3 td{padding:6px 14px;border:0}
  .lb{display:block;margin-bottom:4px;font-size:14px;font-weight:700;color:var(--pr)}
  #t3 .lb,#t4 .lb{font-size:17px}.lb .sn{font-size:17px;color:var(--pr)}
  /* 表四改為單欄 */
  .gh{display:none}.gr{grid-template-columns:1fr;gap:8px}
  /* 發表者時間分配表僅電腦版顯示 */
  details.acc.pc-only{display:none}
  details.acc.mo-only{display:block}
}
@media (min-width:701px){.eb{margin:0 auto}}
</style>

<script>
'use strict';
const D = JSON.parse(document.getElementById('d').textContent);
const S = D.slots;
const NUM = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

/* ---------- 資料查詢 ---------- */
const rooms = [...new Set(D.classes.map(c => c.room))].sort();
const RN = {A:'K501', B:'K502', C:'K503', D:'K504', E:'K602', F:'K603', G:'K604'};
const rn = r => RN[r] || r;   // 教室代號 → 教室名稱
const byName = n => D.classes.find(c => c.name === n);
const inRoom = (r, k) => D.classes.filter(c => c.room === r && c.slots[k]);        // 某教室某時段的發表班級
const listenAt = (g, k) => g.listen.map(byName)                                     // 某組某時段聆聽的班級
  .filter(c => c && c.room === g.route[k] && c.slots[k]);
const groupLabel = g => `第${g.id}組`;

/* ---------- 共用片段 ---------- */
const slotTitle = k => `時段${NUM[k + 1]} <span class="tm">${S[k]}</span>`;
const slotHead = k => `<span class="sn">時段${NUM[k + 1]}</span> <span class="tm">${S[k]}</span>`;
const topics = i => i.p.map((x, j) => `<div class="tp">${i.p.length > 1 ? (j + 1) + '. ' : ''}${esc(x)}</div>`).join('');
const teacher = i => `<div>講師：${esc(i.t)}</div>`;
const lines = (c, k) => c.slots[k].map(i => teacher(i) + topics(i)).join('');
const items = its => its.map(i => `<div class="it"><div class="t">講師：${esc(i.t)}</div>${topics(i)}</div>`).join('');
const blk = (c, k) => `<div class="blk"><div class="cl">${esc(c.name)}</div>${lines(c, k)}</div>`;
const dblk = (c, k) => `<details class="dt"><summary><span class="cl">${esc(c.name)}</span><i class="ch"></i></summary><div class="bd2">${lines(c, k)}</div></details>`;

/* ---------- 個人路線查詢 ---------- */
const BTN = ['瀏覽該時段其他教室發表規劃 ▼', '收合該時段其他教室發表規劃 ▲'];

function roomPanel(k, exclude) {
  return rooms.filter(r => r !== exclude).map(r =>
    `<details class="rd"><summary><b>教室 ${rn(r)}</b> <span class="mu">${esc(inRoom(r, k).map(c => c.name).join('、'))}</span></summary>` +
    inRoom(r, k).map(c => blk(c, k)).join('') + '</details>').join('');
}
const panelBtn = (k, exclude) =>
  `<button class="ac" aria-expanded="false" data-k="${k}">${BTN[0]}</button><div class="pn" id="pn${k}">${roomPanel(k, exclude)}</div>`;

function renderPublisher(c) {
  return S.map((_, k) => {
    const x = c.slots[k];
    if (!x) return `<div class="r off"><div class="h"><span>${slotTitle(k)}</span><span class="tag">⏸ 發表輪空</span></div>` +
      `<div>本時段無發表，可前往其他教室參與。</div>${panelBtn(k, null)}</div>`;
    return `<div class="r"><div class="h"><span>${slotTitle(k)}</span><span class="rm">教室 ${rn(c.room)}</span></div>${items(x)}${panelBtn(k, c.room)}</div>`;
  }).join('');
}

function renderListener(value) {
  const [id, name] = value.split('|');
  const g = D.groups.find(x => x.id === id);
  const head = `<div class="route"><div>${groupLabel(g)}</div><div class="rl"><span>跑班路線</span>${g.route.map(rn).join(' → ')}</div><small>${esc(name)} 屬於此組</small></div><div class="host"><span>組別主持人</span><b>${esc(g.host.replace(/老師$/, ''))}<i class="ts">老師</i></b><small> / ${esc(g.hostClass)}</small></div>`;
  return head + S.map((_, k) => {
    const body = listenAt(g, k).map(c => `<div class="it"><span class="cl">${esc(c.name)}</span>${items(c.slots[k])}</div>`).join('')
      || '<div class="mu">本時段無對應場次</div>';
    return `<div class="r"><div class="h"><span>${slotTitle(k)}</span><span class="rm">教室 ${rn(g.route[k])}</span></div>${body}</div>`;
  }).join('');
}

const roleInputs = document.querySelectorAll('[name=role]');
const select = $('cls');

roleInputs.forEach(input => input.addEventListener('change', () => {
  const pub = input.value === 'pub';
  const options = pub
    ? [...D.classes].sort((a, b) => D.order.indexOf(a.name) - D.order.indexOf(b.name)).map(c => [c.name, c.name])
    : D.groups.flatMap(g => g.members.map(n => [`${g.id}|${n}`, `【${groupLabel(g)}】${n}`]));
  select.disabled = false;
  select.innerHTML = '<option value="">請選擇班級</option>' + options.map(o => `<option value="${esc(o[0])}">${esc(o[1])}</option>`).join('');
  $('res').innerHTML = '';
}));

select.addEventListener('change', () => {
  const v = select.value;
  const pub = document.querySelector('[name=role]:checked').value === 'pub';
  $('res').innerHTML = !v ? '' : pub ? renderPublisher(byName(v)) : renderListener(v);
});

document.addEventListener('click', e => {
  const b = e.target.closest('button.ac');
  if (!b) return;
  const open = $('pn' + b.dataset.k).classList.toggle('o');
  b.setAttribute('aria-expanded', open);
  b.textContent = BTN[open ? 1 : 0];
});

/* ---------- 表格 ---------- */
function table(id, heads, rows) {
  $(id).innerHTML = '<tr>' + heads.map(h => `<th>${h}</th>`).join('') + '</tr>' +
    rows.map(r => '<tr>' + r.map((c, i) => `<td><div class="lb">${heads[i]}</div>${c}</td>`).join('') + '</tr>').join('');
}
const slotHeads = S.map((_, k) => slotHead(k));

// 活動流程表
table('t1', ['時間', '流程'], D.agenda.map(a => a.map(esc)));

// 共學者跑班路線
table('t2', ['', '班級', '跑班路線'],
  D.groups.map(g => [`<b>${groupLabel(g)}</b>`, esc(g.members.join('、')), g.route.map(rn).join(' → ')]));

// 發表班級表（教室 × 時段）
table('t3', ['教室', ...slotHeads],
  rooms.map(r => [`<b>${rn(r)}</b>`, ...S.map((_, k) =>
    inRoom(r, k).map(c => dblk(c, k)).join('') +
    D.classes.filter(c => c.room === r && !c.slots[k]).map(c => `<div class="dt rest"><span class="cl">${esc(c.name)}</span> <span class="oo">（輪空）</span></div>`).join(''))]));

// 發表者時間分配表（依教室分組）
const cell = (c, k) => c.slots[k] ? dblk(c, k) : '<div class="blk off2">發表輪空</div>';
$('t4').innerHTML =
  `<div class="gh gr"><div>班級</div>${slotHeads.map(h => `<div>${h}</div>`).join('')}</div>` +
  rooms.map(r => `<div class="rg"><div class="rt">教室 ${rn(r)}</div>` +
    D.classes.filter(c => c.room === r).map(c =>
      `<div class="gr"><div><div class="lb">班級</div><b>${esc(c.name)}</b></div>` +
      S.map((_, k) => `<div><div class="lb">${slotHeads[k]}</div>${cell(c, k)}</div>`).join('') + '</div>').join('') +
    '</div>').join('');
</script>
</body>
</html>
